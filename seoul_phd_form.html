<!--
    seoul_phd_form.html — <body> 내부 태그(폼 구성)를 텍스트로 저장
    GitHub(macroBIM)에서 관리. seoul_phd.html 이 fetch 하여 #app-root 의 innerHTML 로 주입.
    변수 입력: Front/Back 구분 없이 "Variable / Value" 단일 값, 한 줄에 4쌍(값칸 폭 축소).
    (내부적으로 begin=end 로 미러링되어 등단면(front) 으로 작도됨 — SeoulPhD.redraw 참조)
    단면 선택: box1cell / ibeam / rect / circle / octagon / track
-->

<!-- ══ TOP BAR ══ -->
<div id="topbar">
  <div class="brand">Seoul PhD <span class="tag">macroBIM</span></div>
  <div class="selector">
    <label for="sectionSelect">Section</label>
    <select id="sectionSelect" onchange="SeoulPhD.select(this.value)">
      <option value="box1cell">1-Cell Box Girder (박스거더)</option>
      <option value="ibeam">I-Beam (I형강)</option>
      <option value="rect">Rectangle (사각형)</option>
      <option value="circle">Circle (원형)</option>
      <option value="octagon">Octagon (팔각형)</option>
      <option value="track">Track (트랙형)</option>
    </select>
    <button id="btnToggleNormals" class="btn-normal" onclick="SeoulPhD.toggleNormals()"><i class="bi bi-arrows-angle-expand"></i> Toggle Normals</button>
  </div>
</div>

<!-- ══ STAGE (활성 단면 폼이 클론되는 곳) ══ -->
<div id="stage">
  <div id="mount"><div class="load-msg">Loading section…</div></div>
</div>

<!-- ══════════════════ SECTION TEMPLATES (Variable / Value × 4) ══════════════════ -->
