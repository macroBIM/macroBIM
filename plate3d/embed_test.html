<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLATE3D (test)</title>
<!--
  The development twin of embed.html. Identical but for the engine it loads:
  this one takes plate_builder_test.js, which is where changes land first. The
  macroBIM site's test layout points here, the live layout points at embed.html,
  so an engine change can be tried without touching what visitors see.
  Promote by copying plate_builder_test.js over plate_builder.js and bumping
  embed.html's ?v= - see plate3d/README.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:#f8fafc; overflow:hidden; }
  /* so you can never be in doubt which build you are looking at */
  #pb-build { position:fixed; right:8px; bottom:6px; z-index:9999; pointer-events:none;
    font:600 10px/1 Inter,system-ui,sans-serif; letter-spacing:.08em; color:#b91c1c;
    background:rgba(254,242,242,.92); border:1px solid #fecaca; border-radius:5px;
    padding:4px 7px; }
</style>
</head>
<body>
<div id="pb-build">TEST BUILD</div>
<script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/polybooljs@1.1.0/dist/polybool.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script>
/* The engine, always the current one.

   This used to read plate_builder_test.js?v=81 - a number typed by hand. That
   makes every engine change invisible until someone remembers to raise it, and
   the failure is silent: the file is on GitHub, the commit is pushed, and the
   browser quietly serves what it cached weeks ago. A test build that can show
   you yesterday's code is not a test build.

   So the stamp is computed instead of typed. This is the TEST twin; embed.html
   keeps a pinned version on purpose, because visitors should sit on a known
   build rather than whatever happens to be on main.

   async=false keeps it in order behind the three libraries above, which are
   already parsed by the time this runs - the engine boots itself on
   DOMContentLoaded or immediately, whichever applies, so arriving this way
   changes nothing about when it starts. */
(function () {
  var s = document.createElement('script');
  s.src = 'plate_builder_test.js?v=' + Date.now();
  s.async = false;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
