<!--
  The development twin of embed.html. Identical but for the engine it loads:
  this one takes plate_builder_test.js, which is where changes land first. The
  macroBIM site's test layout points here, the live layout points at embed.html,
  so an engine change can be tried without touching what visitors see.
  Promote by copying plate_builder_test.js over plate_builder.js and bumping
  embed.html's ?v= - see plate3d/README.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body { margin:0; padding:0; height:100%; background:#f8fafc; overflow:hidden; }

  #pb-build { position:fixed; right:8px; bottom:6px; z-index:9999; pointer-events:none;

    background:rgba(254,242,242,.92); border:1px solid #fecaca; border-radius:5px;
