<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLATE3D</title>
<!--
  Embed target for the macroBIM site: the layout drops this page into an
  iframe under the Pier menu. It lives in its own document on purpose - the
  engine wants three.js r147 while the host page runs r0.128, and #pb-app is
  laid out against 100vw/100vh, which inside a frame means the frame itself.
  Empty start; the user loads a sheet with the Load Excel button.
-->
<!-- Inter up front, the same face the macroBIM pages use. The engine injects
     this itself when nobody has, but asking for it here starts the fetch a
     round trip earlier, so the panel does not repaint in the fallback face. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:#f8fafc; overflow:hidden; }
</style>
</head>
<body>
<script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/polybooljs@1.1.0/dist/polybool.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="plate_builder.js?v=12"></script>
</body>
</html>
